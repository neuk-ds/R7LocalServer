name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and test JVM
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: .\gradlew.bat :composeApp:jvmTest :composeApp:packageMacroPlugins --console=plain

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test macro plugins
        run: node --test plugins/tests/*.test.cjs
