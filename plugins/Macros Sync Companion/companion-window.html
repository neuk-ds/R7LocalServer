<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="../v1/plugins.js"></script>
    <script type="text/javascript" src="../v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="../v1/plugins.css">
    <script type="text/javascript" src="companion.js"></script>
</head>
<body>
    <main>
        <header>
            <h1>Проверка макросов</h1>
            <div class="actions">
                <button id="refresh" type="button">Проверить</button>
                <button id="applyAll" type="button" disabled>Применить все</button>
            </div>
        </header>
        <p id="status" role="status" aria-live="polite">Ожидание проверки…</p>
        <ul id="changes" aria-label="Изменённые макросы"></ul>
        <p class="hint">Кнопка применяет версии из библиотеки. Макросы, которых в библиотеке нет, остаются в книге. Для выбора отдельных изменений откройте «Синхронизация макросов».</p>
        <footer class="developer-footer">Разработчик: Дмитрий Неук · <a href="mailto:neukds@yandex.ru">neukds@yandex.ru</a></footer>
    </main>
</body>
</html>
